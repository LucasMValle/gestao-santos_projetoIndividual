<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=ABeeZee:ital@0;1&family=Afacad:ital,wght@0,400..700;1,400..700&family=Geist:wght@100..900&family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <title>Document</title>
</head>
<body>
    <div class="content-login">
        <div class="left">
            <div class="bg-img-login">
                <img src="assets/imgs/banner-left.png" alt="">
            </div>
        </div>
        <div class="logo">
            <img src="assets/imgs/santos.png" alt="">
        </div>
        <div class="right">
            <div class="button-home">
                <img src="assets/imgs/home.svg" alt="">
                <a href="index.html">
                    <button>Home</button>
                </a>
            </div>
            <div class="forms">
                <div class="campo">
                    <span>Nome:</span>
                    <input type="text" placeholder="Neymar" id="nome_input">
                </div>
                <div class="campo">
                    <span>Email:</span>
                    <input type="email" placeholder="neymar@gmail.com" id="email_input">
                </div>
                <div class="campo">
                    <span>Telefone:</span>
                    <input type="tel" placeholder="1199999999999" id="tel_input">
                </div>
                <div class="campo">
                    <span>Senha:</span>
                    <input type="password" placeholder="" id="senha_input">
                </div>
                <div class="campo">
                    <span>Confirmar senha:</span>
                    <input type="password" placeholder="" id="confirmacao_senha_input">
                </div>
                <div id="button-forms">
                    <button onclick="cadastrar()">Cadastrar</button>
                </div>
                <div id="cardErro" style="display: none;">
                    <span id="mensagem_erro"></span>
                </div>
            </div>
            <span id="copy">Copyrights© LucasMValle</span>
        </div>
    </div>
</body>
</html>

<script src="js/sessao.js"></script>

<script>

  // Array para armazenar empresas cadastradas para validação de código de ativação 
  let listaEmpresasCadastradas = [];

  function cadastrar() {
    // aguardar();

    //Recupere o valor da nova input pelo nome do id
    // Agora vá para o método fetch logo abaixo
    var nomeVar = nome_input.value;
    var emailVar = email_input.value;
    var telefoneVar = tel_input.value;
    // var cpfVar = cpf_input.value;
    var senhaVar = senha_input.value;
    var confirmacaoSenhaVar = confirmacao_senha_input.value;

    // Verificando se há algum campo em branco
    if (
      nomeVar == "" ||
      emailVar == "" ||
      senhaVar == "" ||
      confirmacaoSenhaVar == ""
    ) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML =
        "(Mensagem de erro para todos os campos em branco)";

      finalizarAguardar();
      return false;
    } else {
      setInterval(sumirMensagem, 5000);
    }

    if (nomeVar.length < 2) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML =
        "O nome deve conter pelo menos dois caracteres";
      
      finalizarAguardar();
      return false;
    } else {
      setInterval(sumirMensagem, 5000);
    }
    if (!emailVar.includes('@')) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML =
        "O email deve conter @.";
      
      finalizarAguardar();
      return false;
    } else {
      setInterval(sumirMensagem, 5000);
    }
    if (telefoneVar.length > 11) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML =
        "O telefone deve conter até onze caracteres";
      
      finalizarAguardar();
      return false;
    } else {
      setInterval(sumirMensagem, 5000);
    }
    if (senhaVar.length < 7) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML =
        "A senha deve conter pelo menos 7 caracteres.";
      
      finalizarAguardar();
      return false;
    } else {
      setInterval(sumirMensagem, 5000);
    }
    if (confirmacaoSenhaVar !== senhaVar) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML =
        "As senhas devem ser iguais.";
      
      finalizarAguardar();
      return false;
    } else {
      setInterval(sumirMensagem, 5000);
    }
    





    // Verificando se o código de ativação é de alguma empresa cadastrada
    for (let i = 0; i < listaEmpresasCadastradas.length; i++) {
      if (listaEmpresasCadastradas[i].codigo_ativacao == codigoVar) {
        idEmpresaVincular = listaEmpresasCadastradas[i].id
        console.log("Código de ativação válido.");
        break;
      } else {
        cardErro.style.display = "block";
        mensagem_erro.innerHTML = "(Mensagem de erro para código inválido)";
        finalizarAguardar();
      }
    }

    // Enviando o valor da nova input
    fetch("/usuarios/cadastrar/", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        // crie um atributo que recebe o valor recuperado aqui
        // Agora vá para o arquivo routes/usuario.js
        nomeServer: nomeVar,
        emailServer: emailVar,
        telefoneServer: telefoneVar,
        senhaServer: senhaVar
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {
          cardErro.style.display = "block";

          mensagem_erro.innerHTML =
            "Cadastro realizado com sucesso! Redirecionando para tela de Login...";

          setTimeout(() => {
            window.location = "login.html";
          }, "2000");

          limparFormulario();
          finalizarAguardar();
        } else {
          throw "Houve um erro ao tentar realizar o cadastro!";
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
        finalizarAguardar();
      });

    return false;
  }

  // Listando empresas cadastradas 
  function listar() {
    fetch("/empresas/listar", {
      method: "GET",
    })
      .then(function (resposta) {
        resposta.json().then((empresas) => {
          empresas.forEach((empresa) => {
            listaEmpresasCadastradas.push(empresa);

            console.log("listaEmpresasCadastradas")
            console.log(listaEmpresasCadastradas[0].codigo_ativacao)
          });
        });
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
      });
  }

  function sumirMensagem() {
    cardErro.style.display = "none";
  }
</script>
