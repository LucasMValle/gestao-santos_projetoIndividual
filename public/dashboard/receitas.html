<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=ABeeZee:ital@0;1&family=Afacad:ital,wght@0,400..700;1,400..700&family=Geist:wght@100..900&family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styleDash.css">
    <title>Santos FC</title>
</head>
<body onload="listar()">
    <div class="nav-bar">
        <div class="info-user">
            <div class="logo">
                
            </div>
            <span id="NOME_USUARIO"></span>
        </div>
        <ul>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="receitas.html">Receitas</a></li>
            <li><a href="plantel.html">Plantel</a></li>
            <img src="../assets/imgs/santos.png" alt="">
            <li><a href="../index.html" onclick="logout()">Logout</a></li>
        </ul>
    </div>
    <div class="content-dash">
        <button id="add-receita">+</button>
        <span id="balanco-geral">Balanço Geral</span>
        <span id="tittle-receitas">Receitas e despesas</span>
        <div class="all-receitas">
            <div class="left-receitas">
            <div class="mostra-receitas" id="div_receita">
                
            </div>
            <div class="filtro-box">

            </div>
            </div>
            <div class="right-receitas">
                <div class="grafico-receita">
                    <div class="grafico-pie">
                        <canvas id="pie-chart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>




    <dialog id="receita-modal">
        <div class="content-modal">
            <h1>Cadastro de receitas</h1>
            <div class="btn-modal">
                <button id="btn-x">X</button>
            </div>
            <div class="campo-modal">
                <span>Tipo:
                    <div class="select-container">
                    <select name="Selecione" id="tipo_select">
                        <option value="Receita">Receita</option>
                        <option value="Despesa">Despesa</option>
                    </select>
                </div>
                </span>
                
            </div>
            <div class="campo-modal">
                <span>Jogador:
                    <input id="ipt_jogador" type="checkbox">
                </span>
            </div>
            <div class="campo-modal">
                <span>Título:</span>
                <input id="ipt_titulo" type="text" placeholder="Insira o título da receita">
            </div>
            <div class="campo-modal">
                <span>Descrição:</span>
                <input id="ipt_desc" type="text" placeholder="Descrição da receita">
            </div>
            <div class="campo-modal">
                <span>Valor:</span>
                <input id="ipt_valor" type="number" placeholder="Valor da receita">
            </div>
            <div class="campo-modal">
                <span>Bônus:
                    <input id="check-bonus" type="checkbox">
                </span>
                <input id="ipt_bonus" type="number" placeholder="Se houver valores bônus">
            </div>
            <div class="btn-modal">
                <button type="button" onclick="cadastrar()">Cadastrar</button>
            </div>
            <div id="cardErro">
                <div id="mensagem_erro"></div>
            </div>
        </div>
    </dialog>
</body>
</html>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="../js/modal.js"></script>
<script src="../js/userInfo.js"></script>
<script src="../js/chart.js"></script>

<script>
    function limparFormulario() {
            // Limpa os campos de texto e número voltando para string vazia
            document.getElementById('ipt_titulo').value = '';
            document.getElementById('ipt_desc').value = '';
            document.getElementById('ipt_valor').value = '';
            document.getElementById('ipt_bonus').value = '';

            // Reseta o Select para a primeira opção ('Receita')
            document.getElementById('tipo_select').value = 'Receita';

            // Desmarca as caixas de seleção (checkboxes)
            document.getElementById('ipt_jogador').checked = false;
            document.getElementById('check-bonus').checked = false;
            }

    function cadastrar() {
        let tituloVar = ipt_titulo.value;
        let tipoVar = document.getElementById('tipo_select').value;
        let jogadorVar = document.getElementById('ipt_jogador').checked;
        let descricaoVar = ipt_desc.value;
        let valorVar = Number(ipt_valor.value);
        let bonusVar = Number(ipt_bonus.value);

        if (tituloVar == "" || valorVar == "") {
            alert("Por favor, preencha o título e o valor.");
            return;
        }




        fetch("/receita/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        // crie um atributo que recebe o valor recuperado aqui
        // Agora vá para o arquivo routes/usuario.js
        tipoServer: tipoVar,
        jogadorServer: jogadorVar,
        tituloServer: tituloVar,
        descricaoServer: descricaoVar,
        valorServer: valorVar,
        bonusServer: bonusVar
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {
          cardErro.style.display = "block";

          mensagem_erro.innerHTML =
            "Receita cadastrada com sucesso!";

          limparFormulario();
          listar();
        } else {
          throw "Houve um erro ao tentar realizar o cadastro!";
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
      });

        return false;
    }



    function listar() {

        fetch("/receita/listar", {
      method: "GET",
      headers: {
        "Content-Type": "application/json",
      }
      })
    
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {

          return resposta.json();
        } else {
          throw "Houve um erro ao tentar listar as receitas!";
        }
      })
      .then(function (dadosReceitas) {
        console.log("TESTE - O que veio do banco:", dadosReceitas);

        // 3. Aqui dentro de dadosReceitas está a lista que veio do banco de dados
        console.log("Dados recebidos do banco:", dadosReceitas);

        // Limpa a div antes de listar para não duplicar os dados antigos
        // (Troque 'mostra_receitas' pelo ID real da sua div de listagem no HTML)
        let divReceitas = document.getElementById("div_receita"); 
        divReceitas.innerHTML = ""; 

        // Faz um laço de repetição para colocar cada linha do banco na tela
        for (let i = 0; i < dadosReceitas.length; i++) {
            let receitaAtual = dadosReceitas[i];

            if(receitaAtual.tipo == 'Receita') {
                divReceitas.innerHTML += `
                    <div class="receita">
                        <span><b id='tipo_receita'>${receitaAtual.tipo}</b> - ${receitaAtual.titulo_receita}: R$ ${receitaAtual.valor}</span>
                    </div>`;
            } else {
                divReceitas.innerHTML += `
                    <div class="receita">
                        <span><b id='tipo_despesa'>${receitaAtual.tipo}</b> - ${receitaAtual.titulo_receita}: R$ ${receitaAtual.valor}</span>
                    </div>`;
            }
            
        }
    })
    .catch(function (erro) {
        console.log(`#ERRO: ${erro}`);
    });

    return false;
}


</script>
