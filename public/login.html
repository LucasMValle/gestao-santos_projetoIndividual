<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=ABeeZee:ital@0;1&family=Afacad:ital,wght@0,400..700;1,400..700&family=Geist:wght@100..900&family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <div class="content">
        <div class="left">
            <div class="bg-img">
                <img src="/src/assets/imgs/banner-left.png" alt="">
            </div>
        </div>
        <div class="logo">
            <img src="/src/assets/imgs/santos.png" alt="">
        </div>
        <div class="right">
            <div class="button-home">
                <img src="/src/assets/imgs/home.svg" alt="">
                <a href="/public/index.html">
                    <button>Home</button>
                </a>
            </div>
            <div class="forms">
                <div class="campo">
                    <span>Nome:</span>
                    <input type="text" placeholder="Neymar">
                </div>
                <div class="campo">
                    <span>Email:</span>
                    <input type="email" placeholder="neymar@gmail.com">
                </div>
                <div class="campo">
                    <span>Telefone:</span>
                    <input type="tel" placeholder="1199999999999">
                </div>
                <div class="campo">
                    <span>Senha:</span>
                    <input type="text" placeholder="">
                </div>
                <div class="campo">
                    <span>Confirmar senha:</span>
                    <input type="text" placeholder="">
                </div>
                <div id="button-forms">
                    <button>Cadastrar</button>
                </div>
            </div>
            <div class="alerts">

            </div>
            <span id="copy">Copyrights© LucasMValle</span>
        </div>
    </div>
</body>
</html>
