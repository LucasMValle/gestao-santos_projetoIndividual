<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="js/sessao.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=ABeeZee:ital@0;1&family=Afacad:ital,wght@0,400..700;1,400..700&family=Geist:wght@100..900&family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <title>Santos FC</title>
</head>
<body>
    <div class="content-login">
        <div class="left">
            <div class="bg-img-login">
                <img src="assets/imgs/banner-left.png" alt="">
            </div>
        </div>
        <div class="logo">
            <img src="assets/imgs/santos.png" alt="">
        </div>
        <div class="right">
            <div class="button-home">
                <img src="assets/imgs/home.svg" alt="">
                <a href="index.html">
                    <button>Home</button>
                </a>
            </div>
            <div class="forms">
                <div class="campo">
                    <span>Email:</span>
                    <input type="email" placeholder="neymar@gmail.com" id="email_input">
                </div>
                <div class="campo">
                    <span>Senha:</span>
                    <input type="password" placeholder="" id="senha_input">
                </div>
                <div id="button-forms">
                    <button type="button" onclick="entrar()">Login</button>
                </div>
                <div id="cardErro" style="display: none;">
                    <span id="mensagem_erro"></span>
                    <div id="div_aguardar" style="display: none;">
                        Carregando...
                    </div>
                </div>
                <div class="se-inscrevabtn">
                    <span>Ou <a href="cadastro.html">se inscreva</a></span>
                </div>
            </div>
            <span id="copy">Copyrights© LucasMValle</span>
        </div>
    </div>
</body>
</html>



<script>


    function entrar() {
        aguardar();

        var emailVar = email_input.value;
        var senhaVar = senha_input.value;

        if (emailVar == "" || senhaVar == "") {
            cardErro.style.display = "block"
            mensagem_erro.innerHTML = "Todos os campos devem ser preenchidos";
            finalizarAguardar();
            return false;
        }
        else {
            setInterval(sumirMensagem, 5000)
        }

        console.log("FORM LOGIN: ", emailVar);
        console.log("FORM SENHA: ", senhaVar);

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.id;
                    // sessionStorage.CPF = json.cpf || "cpf não veio";
                    // sessionStorage.AQUARIOS = JSON.stringify(json.aquarios)
                    console.log("Redirecionando...");
                    cardErro.style.display = "block";
                    mensagem_erro.innerHTML = `Login efetuado com sucesso!`
                    window.location.href = "./dashboard/dashboard.html";
                    //  setTimeout(function () {
                        
                    //  }, 1000); // apenas para exibir o loading

                });

            } else {

                console.log("Houve um erro ao tentar realizar o login!");
                cardErro.style.display = "block";
                mensagem_erro.innerHTML = `Email ou senha incorreto!`

                finalizarAguardar();

                resposta.text().then(texto => {
                    console.error(texto);
                    finalizarAguardar(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }

    function sumirMensagem() {
        cardErro.style.display = "none"
    }

</script>
